id: lisr-72-73
tipo: ley
jerarquia: 1
instrumento: "Ley del Impuesto sobre la Renta"
articulo_o_regla: "72 y 73"
titulo: "Título II, Capítulo VII — Del Régimen de Coordinados"
citas_en_codigo: ["LISR 72-73", "LISR 72–73", "LISR 72"]
texto_vigente: >
  Artículo 72. Se consideran coordinados, a las personas morales que administran y operan
  activos fijos o activos fijos y terrenos, relacionados directamente con la actividad del
  autotransporte terrestre de carga o de pasajeros y cuyos integrantes realicen exclusivamente
  actividades de autotransporte terrestre de carga o pasajeros o complementarias a dichas
  actividades y tengan activos fijos o activos fijos y terrenos, relacionados directamente con
  dichas actividades.
  ---
  Podrán aplicar lo dispuesto en este Capítulo, las personas morales dedicadas exclusivamente al
  autotransporte terrestre de carga o de pasajeros, siempre que no presten preponderantemente
  sus servicios a otra persona moral residente en el país o en el extranjero, que se considere
  parte relacionada.
  ---
  Para los efectos de este Capítulo, se consideran contribuyentes dedicados exclusivamente a la
  actividad del autotransporte terrestre de carga o de pasajeros, aquéllos cuyos ingresos por
  dichas actividades representan cuando menos el 90% de sus ingresos totales, sin incluir los
  ingresos por las enajenaciones de activos fijos o activos fijos y terrenos, de su propiedad que
  hubiesen estado afectos a su actividad.
  ---
  Los coordinados cumplirán con las obligaciones establecidas en esta Ley, aplicando al efecto lo
  dispuesto en la Sección I del Capítulo II del Título IV de la misma, de acuerdo a lo siguiente:
  I. Calcularán y enterarán, por cada uno de sus integrantes, los pagos provisionales en los
  términos del artículo 106 de esta Ley. Al resultado obtenido conforme a esta fracción se le
  aplicará la tarifa del citado artículo tratándose de personas físicas, o la tasa establecida en el
  artículo 9 de la misma, tratándose de personas morales.
  II. Para calcular y enterar el impuesto del ejercicio de cada uno de sus integrantes, determinarán
  la utilidad gravable del ejercicio aplicando al efecto lo dispuesto en el artículo 109 de esta Ley. A
  la utilidad gravable determinada en los términos de esta fracción, se le aplicará la tarifa del
  artículo 152 de la presente Ley, tratándose de personas físicas, o la tasa establecida en el
  artículo 9 de la misma, tratándose de personas morales. Contra el impuesto que resulte a cargo
  en los términos del párrafo anterior, se podrán acreditar los pagos provisionales efectuados por
  el coordinado. El impuesto del ejercicio se pagará mediante declaración que presentarán las
  personas morales durante el mes de marzo del año siguiente, ante las oficinas autorizadas,
  excepto cuando se trate de personas morales, cuyos integrantes por los cuales cumpla con sus
  obligaciones fiscales sólo sean personas físicas, en cuyo caso la declaración se presentará en el
  mes de abril del año siguiente. Las personas físicas o morales, que cumplan sus obligaciones
  fiscales por conducto de varios coordinados de los cuales son integrantes, en lugar de aplicar lo
  dispuesto en el primer párrafo de esta fracción, podrán optar porque cada coordinado de los
  que sean integrantes efectúe por su cuenta el pago del impuesto sobre la renta, respecto de los
  ingresos que obtengan del coordinado de que se trate, aplicando a la utilidad gravable a que se
  refiere el párrafo anterior la tasa establecida en el artículo 9 de esta Ley, tratándose de
  personas morales o la tasa máxima para aplicarse sobre el excedente del límite inferior que
  establece la tarifa contenida en el artículo 152 de la misma en el caso de personas físicas.
  Dicho pago se considerará como definitivo. Una vez ejercida la opción a que se refiere este
  párrafo, ésta no podrá variarse durante el periodo de cinco ejercicios contados a partir de aquél
  en el que se empezó a ejercer la opción citada. La opción a que se refiere este párrafo también
  la podrán aplicar las personas físicas o morales que sean integrantes de un solo coordinado.
  III. Efectuarán por cuenta de sus integrantes las retenciones y el entero de las mismas y, en su
  caso, expedirán las constancias de dichas retenciones, cuando esta Ley o las demás
  disposiciones fiscales obliguen a ello, así como el comprobante fiscal correspondiente.
  IV. Llevarán un registro por separado de los ingresos, gastos e inversiones, de las operaciones
  que realicen por cuenta de cada uno de sus integrantes, cumpliendo al efecto con lo establecido
  en las disposiciones de esta Ley y en las del Código Fiscal de la Federación. En el caso de las
  liquidaciones que se emitan en los términos del sexto párrafo del artículo 73 de esta Ley, el
  registro mencionado se hará en forma global.
  V. Expedir y recabar los comprobantes fiscales de los ingresos que perciban y de las
  erogaciones que se efectúen, de las operaciones que realicen por cuenta de cada uno de sus
  integrantes, cumpliendo al efecto con lo establecido en esta Ley y en las demás disposiciones
  fiscales.
  VI. Proporcionarán a sus integrantes, constancia de los ingresos y gastos, así como el impuesto
  que el coordinado pagó por cuenta del integrante, a más tardar el 31 de enero de cada año.
  ---
  Para los efectos de este artículo, los coordinados cumplirán con sus propias obligaciones y lo
  harán en forma conjunta por sus integrantes en los casos en que así proceda. Igualmente, el
  impuesto que determinen por cada uno de sus integrantes se enterará de manera conjunta en
  una sola declaración.
  ---
  Para los efectos de esta Ley, el coordinado se considerará como responsable del cumplimiento
  de las obligaciones fiscales a cargo de sus integrantes, respecto de las operaciones realizadas a
  través del coordinado, siendo los integrantes responsables solidarios respecto de dicho
  cumplimiento por la parte que les corresponda.
  ---
  Para los efectos de este artículo, no se considera que dos o más personas son partes
  relacionadas, cuando los servicios de autotransporte terrestre de carga o de pasajeros se
  presten a personas con las cuales los contribuyentes se encuentren interrelacionados en la
  administración, control y participación de capital, siempre que el servicio final de
  autotransporte de carga o de pasajeros sea proporcionado a terceros con los cuales no se
  encuentran interrelacionados en la administración, control o participación de capital, y dicho
  servicio no se preste conjuntamente con la enajenación de bienes. No se consideran partes
  relacionadas cuando el servicio de autotransporte se realice entre coordinados o integrantes del
  mismo.
  ---
  Cuando las personas físicas realicen actividades en copropiedad y opten por tributar por
  conducto de coordinados en los términos de este Capítulo, dichos coordinados serán quienes
  cumplan con las obligaciones fiscales de la copropiedad y se considerarán como representantes
  comunes de la misma.
  ---
  Artículo 73. Tratándose de personas físicas que cumplan sus obligaciones fiscales por conducto
  de varios coordinados de los cuales son integrantes, cuando sus ingresos provengan
  exclusivamente del autotransporte terrestre de carga o de pasajeros, deberán solicitar a los
  coordinados de los que sean integrantes, la información necesaria para calcular y enterar el
  impuesto sobre la renta que les corresponda. Excepto cuando hayan ejercido la opción a que se
  refiere el cuarto párrafo de la fracción II del artículo 72 de esta Ley.
  ---
  Para calcular y enterar el impuesto del ejercicio aplicarán lo dispuesto por el artículo 109 de
  esta Ley. A la utilidad gravable determinada conforme a dicho precepto, se le aplicará la tarifa
  del artículo 152 del presente ordenamiento.
  ---
  Las personas físicas integrantes de personas morales que realicen actividades de
  autotransporte terrestre de carga o de pasajeros, podrán cumplir con las obligaciones
  establecidas en esta Ley en forma individual, siempre que administren directamente los
  vehículos que les correspondan o los hubieran aportado a la persona moral de que se trate.
  Cuando opten por pagar el impuesto en forma individual deberán dar aviso a las autoridades
  fiscales y comunicarlo por escrito a la persona moral respectiva, a más tardar en la fecha en que
  deba efectuarse el primer pago provisional del ejercicio de que se trate.
  ---
  Las personas físicas que hayan optado por pagar el impuesto individualmente, podrán deducir
  los gastos realizados durante el ejercicio que correspondan al vehículo que administren, incluso
  cuando los comprobantes fiscales de los mismos se encuentre a nombre del coordinado, siempre
  que dicha documentación reúna los requisitos que señalen las disposiciones fiscales e identifique
  al vehículo al que corresponda.
  ---
  Las personas morales no considerarán los ingresos que correspondan a sus integrantes que
  hubieran pagado en forma individual ni las deducciones que a ellos correspondan, debiendo
  entregar a las personas físicas y morales que paguen el impuesto individualmente, la
  liquidación de los ingresos y gastos. Las personas morales citadas en primer término deberán
  conservar copia de la liquidación y de los comprobantes de los gastos realizados en el ejercicio,
  relativos al vehículo administrado por dichas personas físicas, durante el plazo a que se refiere
  el artículo 30 del Código Fiscal de la Federación.
  ---
  Las personas morales a que se refiere el artículo 72 de la presente Ley aplicarán lo dispuesto en
  el artículo 12 de la misma, cuando entren en liquidación, debiendo reunir los requisitos que al
  efecto se establezcan en el Reglamento de esta Ley.
  ---
  Las personas morales que no realicen las actividades empresariales por cuenta de sus
  integrantes, deberán cumplir con las obligaciones de este artículo y con los artículos 72, 76, 102
  y 105 de la presente Ley.
  ---
  Cuando los integrantes de las personas morales a que se refiere este Capítulo, se agrupen con
  el objeto de realizar en forma conjunta gastos necesarios para el desarrollo de las actividades a
  que se refiere el mismo, podrán hacer deducible la parte proporcional del gasto en forma
  individual, aun cuando los comprobantes fiscales estén a nombre de alguno de los otros
  integrantes, siempre que dichos comprobantes reúnan los demás requisitos que señalen las
  disposiciones fiscales.
