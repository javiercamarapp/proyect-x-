nota_verificacion: >
  Descargado el 30-ago-2026 el PDF oficial de diputados.gob.mx ("LEY DEL IMPUESTO SOBRE LA
  RENTA", pie de página "Última Reforma DOF 01-04-2024"), convertido con pdftotext -layout y
  transcritos literalmente los artículos 72 y 73 completos (Capítulo VII, "DE LOS COORDINADOS",
  páginas 84-86 de 313 del PDF). Es la ficha que faltaba: el código (`administracion.ts`,
  `entrevista.ts`, `fiscal.ts`) y los evals (`banco-contador.ts`) citan "LISR 72-73" desde antes de la
  auditoría 18-c2, pero no existía una ficha propia — solo se llegaba a este fundamento a través de
  las fichas de la RFA (rfa-2026-2.9), que lo mencionan de pasada. Ahora la ley que sostiene el
  régimen de coordinados tiene su propia ficha verificada, independiente de la RFA que lo
  complementa.
lo_que_ya_estaba_bien_en_el_codigo: >
  `administracion.ts` (comentario FISC-C2-1, auditoría 18-c2, CRÍTICO) ya distingue correctamente
  la clave SAT 624 (Coordinados, Título II Cap. VII) de la 601 (persona moral general de Título II) y
  de la 612 (PF Título IV Cap. II Secc. I) — el error de tratar 601 como si fuera "coordinados" ya se
  corrigió y quedó documentado con prueba (`administracion.test.ts`, líneas 123-165). Esta ficha
  confirma con el texto de la ley que esa distinción es correcta: el Capítulo VII (arts. 72-73) es un
  régimen propio, distinto del Título II general.
el_dato_nuevo_que_esta_ficha_aporta: >
  El test del 90% de ingresos ("cuando menos el 90% de sus ingresos totales, sin incluir los
  ingresos por las enajenaciones de activos fijos... de su propiedad") es un requisito DE LA LEY
  (art. 72, tercer párrafo), no de la RFA — y coincide con la tesis TFJA VI-P-1aS-383 (ficha
  tesis-autotransporte) que dice que no hace falta revisar el 100% de los ingresos del ejercicio para
  probarlo, basta una MUESTRA representativa de habitualidad. Ningún criterio ha fijado si el 90%
  se mide por ejercicio, por mes o acumulado — sigue abierto.
  ---
  La fracción III del art. 72 ("Efectuarán por cuenta de sus integrantes las retenciones y el entero
  de las mismas") es el fundamento LEGAL de las retenciones que la RFA 2026 regla 2.1 (ficha
  rfa-2026-2.1) simplifica al 7.5% para operadores, macheteros y maniobristas — sin esta fracción
  no habría de dónde colgar esa facilidad.
  ---
  La responsabilidad solidaria del coordinado (penúltimo párrafo del art. 72) es SIN MATIZAR por
  la ley: "el coordinado se considerará como responsable del cumplimiento de las obligaciones
  fiscales a cargo de sus integrantes". La única acotación existente es la de RFA 2026 regla 2.3
  (ficha rfa-2026-2.3), y solo aplica cuando el coordinado usa las reglas 2.1/2.2 y el integrante
  concreto tributa individual.
plazos_que_el_producto_podria_necesitar_citar: >
  Declaración anual del coordinado: marzo del año siguiente (o abril si todos sus integrantes son
  personas físicas). Constancia anual a integrantes (ingresos, gastos, impuesto pagado por
  cuenta del integrante): a más tardar el 31 de enero de cada año. Opción de pago individual del
  integrante: debe avisarse a más tardar en la fecha del primer pago provisional del ejercicio.
  Ninguno de estos plazos está hoy en el corpus del agente contador (`normas/consulta.ts`).
pendiente_en_producto: >
  Likida no calcula el ISR anual de un coordinado ni de sus integrantes (fuera de su dominio:
  liquida viajes, no declara impuestos de terceros). Esta ficha es fundamento para el agente
  contador y para el producto de facturación (que sí necesita saber si el RECEPTOR de un CFDI es
  un coordinado 624 — ver `fiscal.ts`), no para un nuevo cálculo del motor.
