id: rfa-2026-2.5
tipo: rfa
jerarquia: 3
instrumento: "Resolución de Facilidades Administrativas para 2026"
articulo_o_regla: "2.5"
titulo: "Concepto de coordinado (la definición administrativa que completa a LISR 72)"
citas_en_codigo: ["RFA 2026 regla 2.5"]
texto_vigente: >
  Para los efectos de lo establecido en los artículos 72 y 73 de la Ley del ISR, se considerará
  como coordinado a toda persona moral dedicada exclusivamente al servicio de autotransporte
  terrestre de carga federal, que agrupa y se integra con otras personas físicas y personas
  morales similares y complementarias, constituidas con el propósito de proporcionar servicios
  necesarios para la actividad común de autotransporte terrestre de carga federal. Estos
  elementos integran una unidad económica con intereses comunes y participan de manera
  conjunta y en proporciones no identificables con los propósitos siguientes:
  ---
  I. Coordinar y convenir los servicios que se presten de manera conjunta, incluyendo las
  empresas que presten servicios o posean inmuebles dedicados a la actividad de autotransporte
  terrestre de carga federal. En el caso de centrales o paraderos de autotransporte que no sean
  integrantes de algún coordinado, podrán tributar en el Título II, Capítulo VII de la Ley del ISR,
  siempre que estén conformadas por empresas dedicadas al autotransporte de carga federal y
  presten sus servicios preponderantemente a empresas de autotransporte terrestre de carga
  federal. Además, dichas centrales o paraderos no aplicarán las facilidades contenidas en las
  reglas 2.1., 2.2. y 2.9. de la presente Resolución.
  ---
  II. Cumplir con las obligaciones fiscales por cuenta de cada uno de sus integrantes en forma
  global.
  ---
  III. Contar con un manual de políticas para la aplicación de los gastos comunes y su prorrateo a
  cada uno de sus integrantes, el cual deberán tener a disposición de las autoridades fiscales
  cuando se lo soliciten.
fecha_publicacion: 2026-02-17
