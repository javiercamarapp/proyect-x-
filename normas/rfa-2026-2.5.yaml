estado_verificacion: verificado_fuente_primaria
nota_verificacion: >
  Leída el 30-ago-2026 en el PDF oficial del minisitio del SAT (mismo documento que
  rfa-2026-2.1/2.2/2.3/2.9), bajo el subtítulo propio "Concepto de coordinado".
por_que_importa: >
  LISR 72 (ficha lisr-72-73) define "coordinado" en función de QUÉ ACTIVOS administra la
  persona moral (activos fijos, o activos fijos y terrenos, del autotransporte). Esta regla de la RFA
  AÑADE una capa distinta: coordinado es una UNIDAD ECONÓMICA de intereses comunes que
  agrupa a integrantes "en proporciones NO IDENTIFICABLES" — un rasgo que ninguna ficha de
  ley por sí sola capturaba y que puede pesar en una discusión sobre si una estructura societaria
  concreta encaja o no en el régimen.
la_excepcion_de_centrales_y_paraderos: >
  La fracción I trae una regla con dientes propios: una central o paradero de autotransporte que
  NO es integrante de ningún coordinado puede tributar en Título II Cap. VII (y aparecer con
  régimen fiscal 624) si (a) la integran empresas de autotransporte de carga federal y (b) presta
  sus servicios PREPONDERANTEMENTE a empresas de autotransporte de carga federal — pero
  esa central o paradero NO PUEDE aplicar las facilidades de las reglas 2.1 (retención 7.5%), 2.2
  (deducción ciega 8%) ni 2.9 (15% de diésel en efectivo). Es la única excepción documentada en
  la RFA donde el régimen 624 NO abre automáticamente esas tres facilidades.
impacto_en_producto: >
  Si Likida llegara a dar de alta una flota que en realidad es una central o paradero (no un
  coordinado de transportistas), la regla `REGIMENES_ELEGIBLES_15 = ['624', '612']` de
  `perfil/preguntas.ts` (RFA 2.9) la aceptaría por su régimen fiscal SAT sin distinguir este caso —
  el régimen 624 por sí solo no basta para saber si aplica o no la facilidad del 15%. Esto no es un
  drift confirmado (Likida hoy vende a flotas y transportistas, no a centrales/paraderos), pero es
  un hueco de precisión que vale la pena que el fiscalista confirme antes de que el producto entre
  a ese segmento — ver reporte de esta auditoría.
pendiente_en_producto: >
  Sin escritor todavía: `regimenFiscal` no distingue "coordinado de transportistas" de "central o
  paradero tributando en 624". Ficha creada para que el corpus del agente contador tenga de
  dónde citar esta distinción si se le pregunta.
