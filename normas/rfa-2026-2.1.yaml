nota_verificacion: >
  Descargado el 30-ago-2026 el PDF que el propio minisitio de Normatividad del SAT aloja de la
  RFA 2026 (DOF 17-feb-2026), convertido con pdftotext y localizado el texto íntegro de la regla
  bajo el encabezado "Título 2. Sector de Autotransporte Terrestre de Carga Federal — Retención
  del ISR a operadores, macheteros y maniobristas". Es la regla INMEDIATA ANTERIOR a la 2.2
  (gasto ciego del 8%, ya fichada) dentro del mismo Título 2. Buscada además cualquier
  modificación posterior: la 1ª Resolución de Modificaciones a la RMF 2026 (DOF 09-jul-2026) solo
  MENCIONA la sigla "RFA" en su glosario de abreviaturas (línea 39 de su texto) y no toca ninguna
  regla del Título 2 de la propia RFA. No se localizó ninguna "Resolución de Modificaciones a la
  RFA 2026" publicada al 30-ago-2026.
cambio_de_numero: false
condiciones_de_aplicacion:
  - "Dedicados EXCLUSIVAMENTE al autotransporte terrestre de carga FEDERAL — la MISMA fórmula que 2.2 y 2.9; pasaje y turismo foráneo son materia de la RFA 3.12, sin ficha en este repo"
  - "Tributar en Título II Cap. VII (coordinados) o Título IV Cap. II Secc. I (PF con actividad empresarial) — mismas dos claves que abren 2.2 y 2.9: 624 y 612"
  - "Es una OPCIÓN, no una obligación: sustituye el régimen de sueldos y salarios, no lo complementa"
  - "Solo cubre pagos a OPERADORES, MACHETEROS y MANIOBRISTAS — pagos a otros trabajadores siguen la LISR general (Título IV Cap. I, sueldos y salarios)"
  - "No prestar preponderantemente el servicio a una parte relacionada (misma condición que LISR 72, segundo párrafo)"
lo_que_no_dice_la_regla: >
  No es una exención ni una tasa reducida del ISR del trabajador: es una BASE distinta (el SBC del
  IMSS en vez del sueldo real) sobre la que se retiene un 7.5% fijo, en sustitución del cálculo con
  tarifa progresiva de sueldos y salarios. Requiere de todos modos emitir el CFDI de nómina y su
  complemento, y entregar antes del 15-feb-2027 la relación individualizada del personal — no es
  "sin papeleo" como sí lo es la 2.2.
relacion_con_otras_reglas: >
  RFA 2.3 (ficha rfa-2026-2.3) acota la responsabilidad solidaria del coordinado cuando aplica esta
  regla y algún integrante opta por tributar individual: solo responde por lo que conste en la
  liquidación de ESE integrante. RFA 2.5 (ficha rfa-2026-2.5) excluye de esta regla a las centrales o
  paraderos de autotransporte que tributen en Título II Cap. VII sin ser integrantes de un
  coordinado.
pendiente_en_producto: >
  Likida NO calcula ni retiene nómina de operadores hoy (el dominio del producto es la
  liquidación de viajes contra comprobantes y anticipo, no la relación laboral) — por eso
  `usado_en_codigo` está vacío y no hay drift que reportar todavía. Esta ficha existe porque el
  corpus del agente contador (`normas/consulta.ts`, tema `nomina_imss_y_descuentos`) puede
  recibir la pregunta "¿cómo se retiene el ISR a mis operadores?" y hoy respondería sin fundamento
  fiscal — con esta ficha puede citar la regla 2.1 en vez de guardar silencio o improvisar.
