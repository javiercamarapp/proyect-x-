id: rfa-2026-2.1
tipo: rfa
jerarquia: 3
instrumento: "Resolución de Facilidades Administrativas para 2026"
articulo_o_regla: "2.1"
titulo: "Retención del ISR a operadores, macheteros y maniobristas (7.5%, sobre el SBC)"
citas_en_codigo: ["RFA 2026 regla 2.1"]
texto_vigente: >
  Los contribuyentes personas físicas y morales, dedicados exclusivamente al autotransporte
  terrestre de carga federal y que tributen en los términos del Título II, Capítulo VII o Título IV,
  Capítulo II, Sección I de la Ley del ISR, podrán optar por enterar el 7.5 por ciento por concepto
  de retenciones del ISR, correspondiente a los pagos efectivamente realizados a operadores,
  macheteros y maniobristas, en lugar de aplicar las disposiciones correspondientes al pago de
  salarios.
  ---
  Para calcular estas retenciones, se tomará como referencia el salario base de cotización
  utilizado para el cálculo de las aportaciones de dichos trabajadores al IMSS, conforme a la
  normatividad aplicable, en cuyo caso, deberán elaborar y entregar, a más tardar el 15 de
  febrero de 2027, una relación individualizada de dicho personal en la que se indique las
  cantidades que les son pagadas en el periodo de que se trate, en los términos en que se
  elabora para efectos de las aportaciones que realicen al IMSS, así como del impuesto retenido,
  de conformidad con la ficha de trámite 65/ISR "Aviso que presentan los contribuyentes
  dedicados a la actividad de autotransporte terrestre de carga federal que ejercen la opción de
  enterar el 7.5 por ciento por concepto de retenciones de ISR", contenida en el Anexo 2 de la
  RMF, además de emitir el CFDI y su complemento por concepto de nómina correspondiente.
  ---
  Tratándose de pagos realizados a trabajadores distintos a los señalados en esta regla, se
  aplicará lo establecido en la Ley del ISR.
  ---
  Esta regla será aplicable siempre que los contribuyentes a que se refiere el primer párrafo de la
  misma no presten preponderantemente sus servicios a otra persona moral residente en el país
  o en el extranjero, que se considere parte relacionada en los términos de la Ley del ISR.
