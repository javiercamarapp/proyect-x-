# ⚠️ TENSIÓN VIVA (16-ago-2026): dos lecturas del estímulo LIF 20-A-IV se
# sostienen del mismo texto — (A) cuota ÍNTEGRA de ley vs (B) cuota DISMINUIDA
# semanal (factor 3.5× entre ellas). El criterio 1/LIF/PI apunta a (B) y la
# letra de la LIF permite leer (A). HASTA QUE UN FISCALISTA CON CÉDULA FIRME
# UNA: el producto y el marketing muestran LITROS acreditables y rango, jamás
# el estímulo en pesos.
#
# ✅ VERIFICADO CONTRA DOF (16-ago, lectura íntegra de la 1ª RM RMF 2026,
# codNota 5793101): la regla 11.7.3 (precio base del diésel, retroactiva al
# 1-abr por el transitorio VIGÉSIMO SEXTO — no "Sexto") opera sobre un INSUMO
# del cálculo de la SHCP y su efecto YA VIENE INCORPORADO en las cuotas que
# se publican cada viernes (probado: monto+disminuida=7.3634 exacto en 7
# semanas revisadas). REGLA OPERATIVA: consumir SIEMPRE la cuota publicada;
# JAMÁS recalcular el estímulo desde la metodología. Las 4 filas de abajo se
# cotejaron dígito por dígito contra sus 4 acuerdos en el DOF: exactas.
# La cuota completa 7.3634 está anclada a fuente primaria: Acuerdo 179/2025,
# codNota 5776844 (DOF 22-dic-2025), vigente desde 1-ene-2026 — su fuente
# real es LIEPS art. 2o-I-D)-1-c actualizada por ese acuerdo, NO la LIF.
# Cuotas semanales del IEPS de diésel — la fuente del estímulo (ficha lif-2026-20-A).
#
# PRIMERA CAPTURA REAL: 16-ago-2026, tras 23 días de vigilancia bloqueada por
# egress en el entorno de la routine. Este archivo NO existía — el motor no
# tenía con qué calcular el estímulo en pesos para NINGUNA fecha (por eso el
# panel muestra el diésel elegible en LITROS, nunca en pesos).
#
# CADA fila viene del acuerdo semanal del DOF (viernes, edición vespertina),
# leído por SIDOF con su codNota — jamás de memoria. Verificación aritmética
# en cada semana: estimulo + cuota_disminuida = 7.3634 (la cuota completa de
# diésel de la LIF 2026) — las cuatro cuadran exacto.
#
# LO QUE FALTA, dicho: el histórico anterior al 25-jul-2026 no está capturado
# (barrido histórico pendiente); el motor todavía NO consume este archivo
# (cablearlo es el siguiente paso declarado — hoy la cifra en pesos seguiría
# sin pintarse, que es el comportamiento honesto actual).
#
# AUDITORÍA 18 (B5) — QUIÉN LEE ESTO Y QUÉ SIGNIFICA CADA CAMPO:
#   · Lector: `src/lib/likida/cuadre/cuota_diesel.ts` (parser parcial + validador
#     + `cuotaDieselVigente`, que devuelve null fuera de rango: NUNCA cae al
#     último valor). `cuota_diesel.test.ts` lee ESTE archivo y falla si una
#     semana no empalma, la aritmética no cierra o un campo falta.
#   · El motor (engine.ts) SIGUE sin multiplicar: entrega litros (decisión D2 y
#     la tensión de arriba). Cablearlo es una línea cuando un fiscalista firme.
#   · `cuota_disminuida_por_litro` ES el estímulo por litro del transportista
#     (criterio 1/LIF/PI): 500 L × 2.2760 = $1,138.00.
#   · `reduccion_shcp_por_litro` (antes `estimulo_por_litro`, nombre que
#     invitaba a multiplicarlo por los litros: 500 × 5.0874 = $2,543.70, 2.2× de
#     más) es el recorte que la SHCP le aplica a la cuota completa. Se conserva
#     solo para el chequeo aritmético: reducción + disminuida = cuota completa.
cuota_completa_lif_2026: 7.3634   # $/litro, diésel (LIEPS 2o-I-D-1-c vía Acuerdo 179/2025)
