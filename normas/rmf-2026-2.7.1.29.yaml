id: rmf-2026-2.7.1.29
tipo: regla_general
jerarquia: 3
instrumento: "Resolución Miscelánea Fiscal para 2026"
articulo_o_regla: "2.7.1.29"
titulo: "Forma de pago por definir y complemento de recepción de pagos"
citas_en_codigo: ["RMF 2.7.1.29"]
texto_vigente: >
  indicar la clave 99 “Por definir” en el caso de no haberse recibido el pago
  de la contraprestación
alcance_extracto: "Fragmento literal de la fracción II; no es la transcripción completa de la regla."
resumen_contexto: >
  La fracción II permite esa clave en el CFDI antes de recibir el pago y exige
  emitir el comprobante con complemento de recepción de pagos cuando se reciba.
  Exceptúa las operaciones de la regla 3.3.1.34 y el pago íntegro previo o al
  expedir el CFDI: en esos casos debe registrarse la forma correspondiente.
fecha_publicacion: 2025-12-28
fecha_vigencia_desde: 2026-01-01
fuente_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/documentos2026/rmf/rmf/RMF_2026-DOF-28122025.pdf#page=112"
fuente_tipo: sat_oficial
