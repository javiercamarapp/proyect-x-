verificado_el: 2026-09-05
verificado_por: "Codex: lectura del PDF oficial, página 112, fracción II; revisión de la primera modificación."
nota_verificacion: >
  El índice oficial SAT de 2026 consultado el 5-sep enumera la resolución
  original y la primera modificación del 9-jul. El resolutivo Primero de esa
  modificación no incluye esta regla. Verificación documental; no dictamen.
fuente_modificaciones: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/documentos2026/rmf/rmf/1aRM_RMF2026.pdf"
fuente_indice: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
limite_interpretacion: >
  Esta regla explica el 99 del CFDI original; no autoriza usar 99 como medio
  efectivo en un REP. La migración 0345 corrige paridad SQL/motor ante datos
  incompletos, sin certificar ese REP. El acreditamiento mensual depende además
  del pago efectivo que exige LIVA 5-III y de los demás requisitos aplicables.
